name: Build YouTube draft
on:
  workflow_dispatch:
    inputs:
      topic_index:
        description: "Topic index in config/topics.json (starting at zero)"
        required: true
        default: "0"
permissions:
  contents: read
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TOPIC_INDEX: ${{ inputs.topic_index }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install -r requirements.txt
      - name: Generate draft
        run: python -m src.produce
      - name: Retain private review assets
        uses: actions/upload-artifact@v4
        with:
          name: workflow-lab-draft
          path: output/
          retention-days: 7
